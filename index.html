<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indonesia Explorer</title>
    <meta name="theme-color" content="#0f1f3a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="./assets/favicons/favicon.svg">
    <link rel="shortcut icon" href="./assets/favicons/favicon.svg">
    <link rel="apple-touch-icon" href="./assets/favicons/favicon.svg">
    <link rel="preload" as="image" href="./assets/images/jakarta-stadium.avif" type="image/avif" fetchpriority="high">
    <link rel='stylesheet' href='style.min.css?v=20260617'>
</head>
<body>
    <div class="page-layout">
        <aside class="ad-sidebar ad-sidebar-left" aria-label="Left advertisement">
            <div class="ad-box">
                <span class="ad-box-label">Място за реклама</span>
            </div>
        </aside>

        <div class="container">
            <header>
                <h1 id="headerTitle">🇮🇩 Indonesia Explorer</h1>
                <p id="headerSubtitle">Explore detailed information about Indonesia</p>
                <p id="visitCounter" class="visit-counter">Посещения: ...</p>
                <div class="language-selector" role="group" aria-label="Language selector">
                    <button class="lang-btn active" onclick="changeLanguage('bg')" id="bgBtn">BG</button>
                    <button class="lang-btn" onclick="changeLanguage('en')" id="enBtn">EN</button>
                    <button class="lang-btn" onclick="changeLanguage('de')" id="deBtn">DE</button>
                    <button class="lang-btn" onclick="changeLanguage('fr')" id="frBtn">FR</button>
                    <button class="lang-btn" onclick="changeLanguage('es')" id="esBtn">ESP</button>
                    <button class="lang-btn" onclick="changeLanguage('id')" id="idBtn">IND</button>
                </div>
            </header>

            <div id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 20px;">Loading Indonesia data...</p>
                </div>
            </div>
        </div>

        <aside class="ad-sidebar ad-sidebar-right" aria-label="Right advertisement">
            <div class="ad-box">
                <span class="ad-box-label">Място за реклама</span>
            </div>
        </aside>
    </div>

    <!-- City Modal -->
    <div class="modal-overlay" id="cityModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="image-container">
                <img id="modalImage" class="modal-image" src="" alt="City" loading="lazy" decoding="async" sizes="(max-width: 768px) 90vw, 600px">
            </div>
            <div class="modal-body">
                <div id="modalRank" class="modal-rank"></div>
                <h2 id="modalTitle" class="modal-title"></h2>
                <p id="modalDescription" class="modal-description"></p>
                
                <div class="modal-info">
                    <div class="modal-info-item">
                        <div class="modal-info-label" id="populationLabel">Population</div>
                        <div id="modalPopulation" class="modal-info-value"></div>
                    </div>
                    <div class="modal-info-item">
                        <div class="modal-info-label" id="coordinatesLabel">Coordinates</div>
                        <div id="modalCoordinates" class="modal-info-value"></div>
                    </div>
                </div>

                <div class="modal-highlights">
                    <div class="highlights-title" id="attractionsLabel">Key Attractions</div>
                    <div id="modalHighlights" class="highlights-list"></div>
                </div>

                <div class="modal-highlights" id="modalHotelsSection">
                    <div class="highlights-title" id="hotelsLabel">Top 5 Hotels</div>
                    <div id="modalHotels" class="highlights-list hotel-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stadium Modal -->
    <div class="modal-overlay" id="stadiumModal">
        <div class="modal-content stadium-modal-content">
            <button class="modal-close" onclick="closeStadiumModal()">&times;</button>
            <div class="image-container">
                <img id="stadiumModalImage" class="modal-image stadium-modal-image" src="" alt="Gelora Bung Karno football pitch view" loading="lazy" decoding="async" sizes="(max-width: 768px) 95vw, 640px" style="background: linear-gradient(45deg, #f0f0f0 25%, #e0e0e0 25%, #e0e0e0 50%, #f0f0f0 50%, #f0f0f0 75%, #e0e0e0 75%, #e0e0e0);">
            </div>
            <div class="modal-body">
                <h2 id="stadiumModalTitle" class="modal-title"></h2>
                <p id="stadiumModalDescription" class="modal-description"></p>

                <div class="modal-info stadium-modal-info">
                    <div class="modal-info-item">
                        <div class="modal-info-label" id="stadiumCapacityLabel"></div>
                        <div class="modal-info-value" id="stadiumCapacityValue"></div>
                    </div>
                    <div class="modal-info-item">
                        <div class="modal-info-label" id="stadiumOpenedLabel"></div>
                        <div class="modal-info-value" id="stadiumOpenedValue"></div>
                    </div>
                    <div class="modal-info-item">
                        <div class="modal-info-label" id="stadiumUseLabel"></div>
                        <div class="modal-info-value" id="stadiumUseValue"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Wildlife Modal -->
    <div class="modal-overlay" id="wildlifeModal">
        <div class="modal-content stadium-modal-content">
            <button class="modal-close" onclick="closeWildlifeModal()">&times;</button>
            <div class="image-container">
                <img id="wildlifeModalImage" class="modal-image stadium-modal-image" src="" alt="Indonesian wildlife" loading="lazy" decoding="async" sizes="(max-width: 768px) 95vw, 640px">
            </div>
            <div class="modal-body">
                <h2 id="wildlifeModalTitle" class="modal-title"></h2>
                <p id="wildlifeModalDescription" class="modal-description"></p>
            </div>
        </div>
    </div>

    <!-- Ticket Modal -->
    <div class="modal-overlay" id="ticketModal">
        <div class="modal-content ticket-modal-content">
            <button class="modal-close" onclick="closeTicketModal()">&times;</button>
            <div class="modal-body">
                <h2 id="ticketModalTitle" class="modal-title"></h2>
                <p id="ticketModalDescription" class="modal-description"></p>
                <form id="ticketForm" class="ticket-form">
                    <div class="ticket-form-grid">
                        <label class="ticket-field">
                            <span id="ticketDateLabel" class="ticket-label"></span>
                            <input id="ticketDateInput" name="travelDate" type="date" required>
                        </label>
                        <label class="ticket-field">
                            <span id="ticketTimeLabel" class="ticket-label"></span>
                            <input id="ticketTimeInput" name="travelTime" type="time" required>
                        </label>
                        <label class="ticket-field">
                            <span id="ticketDepartureLabel" class="ticket-label"></span>
                            <input id="ticketDepartureInput" name="departureCity" type="text" required>
                        </label>
                        <label class="ticket-field">
                            <span id="ticketTravelersLabel" class="ticket-label"></span>
                            <input id="ticketTravelersInput" name="travelers" type="number" min="1" max="12" value="1" required>
                        </label>
                        <label class="ticket-field">
                            <span id="ticketClassLabel" class="ticket-label"></span>
                            <select id="ticketClassInput" name="ticketClass">
                                <option value="economy" id="ticketClassEconomy"></option>
                                <option value="business" id="ticketClassBusiness"></option>
                                <option value="first" id="ticketClassFirst"></option>
                            </select>
                        </label>
                        <label class="ticket-field ticket-field-full">
                            <span id="ticketEmailLabel" class="ticket-label"></span>
                            <input id="ticketEmailInput" name="email" type="email" required>
                        </label>
                    </div>
                    <button id="ticketSubmitBtn" class="ticket-submit-btn" type="submit"></button>
                </form>
                <p id="ticketFormStatus" class="ticket-form-status" aria-live="polite"></p>
            </div>
        </div>
    </div>

    <!-- Blog Modal -->
    <div class="modal-overlay" id="blogModal">
        <div class="modal-content blog-modal-content">
            <button class="modal-close" onclick="closeBlogModal()">&times;</button>
            <div class="modal-body">
                <h2 id="blogModalTitle" class="modal-title"></h2>
                <div id="blogModalContent" class="blog-article-content"></div>
            </div>
        </div>
    </div>

    <script src="./assets/js/indo.translations.js?v=20260617" defer></script>
    <script src="./assets/js/indo.data.js?v=20260603" defer></script>
    <script src="./assets/js/indo.min.js?v=20260617" defer></script>
</body>
</html>
