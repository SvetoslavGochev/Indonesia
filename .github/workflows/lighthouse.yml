name: Lighthouse QA

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - ".lighthouserc.pr.json"
      - ".lighthouserc.main.json"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - ".lighthouserc.pr.json"
      - ".lighthouserc.main.json"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

jobs:
  lighthouse-ci-local:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse (CI local)
        run: npm run qa:lighthouse:ci-local

  lighthouse-production-audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse (production audit)
        run: npm run qa:lighthouse:production
